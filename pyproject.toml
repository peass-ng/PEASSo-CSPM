[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacktricks-cspm"
version = "0.1.0"
description = "PEASS'o CSPM: read-only cloud posture, IAM and RBAC security review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43", "PyJWT[crypto]>=2.10", "tzdata>=2024.1"]

[project.optional-dependencies]
ai = ["chack-agent @ git+https://github.com/carlospolop/chack-agent.git@7e258d0602b9aa065bfa2d06aa53be5fe525531f", "jsonschema>=4", "psutil>=6", "orjson==3.13.0"]
secrets = ["kingfisher-secret-scanner==1.4.0"]
hosted = ["boto3==1.43.38", "botocore==1.43.38", "mangum>=0.19", "requests>=2"]
cloud = ["boto3==1.43.38", "botocore==1.43.38", "google-auth>=2", "azure-identity>=1.17", "azure-mgmt-resource", "azure-mgmt-subscription", "azure-mgmt-authorization", "azure-mgmt-monitor", "requests>=2", "termcolor", "tqdm", "kubernetes>=34,<36"]
analytics = ["duckdb>=1.3"]
test = ["pytest>=8", "pyflakes==3.4.0", "httpx>=0.27", "jsonschema>=4", "setuptools>=68", "wheel", "moto[s3]>=5"]
release-build = ["zopfli==0.4.3"]

[project.urls]
Homepage = "https://cspm.hacktricks.wiki"
Repository = "https://github.com/peass-ng/PEASSo-CSPM"
Issues = "https://github.com/peass-ng/PEASSo-CSPM/issues"

[project.scripts]
hacktricks-cspm = "peaso.cli:main"
peaso = "peaso.cli:main"

[tool.setuptools.packages.find]
include = ["peaso*", "bluepeass*", "scripts*", "risk_rules*", "tests.fixtures"]

[tool.setuptools.package-data]
"peaso.ai._vendor.chack" = ["config/thinking_effort.yaml", "LICENSE", "provenance.json"]
peaso = ["*.yaml", "ai/agents/*.yaml", "ai/*.json", "server/*.json", "check_services.json", "collection_job_kinds_20261029.json", "private_secret_source_epoch_20261021.json", "private_secret_source_epoch_20261021.zip", "private_reviewed_collector_successor_20261022.json", "rulepacks/*.json", "rulepacks/*.json.gz", "rulepacks/licenses/*.txt", "risk_catalog/*.yaml", "checks/*.json", "checks/*.json.gz", "checks/provider_group_witnesses_20261021/spec-successor.json", "checks/provider_group_witnesses_20261021/spec.json", "checks/provider_group_witnesses_20261021/test_gcp_job_image_vulnerability_product_20261021.py", "checks/provider_group_witnesses_20261021/test_runtime_existing_transport.py", "checks/provider_group_witnesses_20261021/test_runtime_native.py", "checks/provider_group_witnesses_20261021/test_storage_immutability_native_successor.py", "checks/provider_group_witnesses_20261021/test_storage_immutability_presentation.py", "collectors/*.json", "privesc/*.json", "privesc/*.yaml", "privesc/catalog_versions/*.json", "privesc/catalog_versions/*.tar.gz", "privesc/catalog_versions/*.zip", "privesc/catalog/*/*.yaml"]
bluepeass = ["*.yaml", "*.json"]

risk_rules = ["*.yaml", "*.json", "hacktricks-privesc/azure-challenge-removals-ledger.json"]

# Required runtime admission data at immutable receipt-pinned logical paths.
# This namespace contains only these four data files, not the test suite.
"tests.fixtures" = [
    "azure_nsp_query_cmk_metadata_proposal_20261020.json.gz",
    "azure_nsp_query_cmk_runtime_native_20261020.json.gz",
    "azure_nsp_query_cmk_production_native_20261020.json.gz",
    "azure_sql_tde_parent_identity_predecessor_20261020.json.gz",
]

[tool.pytest.ini_options]
# Runtime admission witnesses under peaso/ are package data, not test modules.
# Match CI collection and keep every executable test under tests/ enabled.
testpaths = ["tests"]
