name: Check vendored chack-agent helpers against master
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Vendored chack helpers match chack-agent master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fail when peaso/ai/_vendor/chack is stale (fix with python scripts/sync_chack_vendor.py)
        run: python scripts/sync_chack_vendor.py --check
