name: Sync HackTricks permission categorizations and privesc paths
on:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-permission-categorizations
  cancel-in-progress: false
jobs:
  sync:
    name: Sync permission categorizations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch canonical permissions with retries
        run: python scripts/fetch_hacktricks_permissions.py --destination .canonical-source
      - name: Install offline validation dependencies
        # Collection imports require jmespath even for offline sync tests.
        run: python -m pip install --retries 5 --timeout 30 'PyYAML>=6' 'requests>=2' 'pytest>=8' 'jmespath>=1'
      - name: Synchronize and verify canonical permissions
        run: |
          python scripts/sync_hacktricks_permissions.py --book-root .canonical-source --supplement risk_rules/reviewed-permission-supplement.json
          python scripts/sync_hacktricks_permissions.py --book-root .canonical-source --supplement risk_rules/reviewed-permission-supplement.json --check
          python -m pytest -q tests/test_canonical_permissions.py tests/test_permission_source_fetch.py tests/test_permission_sync_supplement.py tests/test_peaso_permission_catalog_coverage.py
      - name: Commit changed copies
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add risk_rules aws_permissions_cat.yaml gcp_permissions_cat.yaml azure_permissions_cat.yaml
          if git diff --cached --quiet; then
            echo 'Canonical permission hashes are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync canonical permission categorizations from HackTricks Cloud'
          git push origin "HEAD:$DEFAULT_BRANCH"
  privesc:
    name: Sync privilege-escalation paths
    # Runs after the permission job (it checks out the branch that job may have pushed) and
    # independently of its result, so one data set failing never blocks the other.
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch canonical privesc paths and cited pages with retries
        run: python scripts/fetch_hacktricks_permissions.py --destination .canonical-source --with-privesc --require-privesc --revision-file risk_rules/hacktricks-privesc-source.json
      - name: Install offline validation dependencies
        run: python -m pip install --retries 5 --timeout 30 'PyYAML>=6' 'pytest>=8' 'jmespath>=1'
      - name: Synchronize and verify canonical privesc paths
        # Upstream content is schema-validated before writing; conflicting edits and dropped
        # technique ids without a reviewed ledger fail this step and leave the branch unchanged.
        run: |
          python scripts/sync_hacktricks_privesc.py --book-root .canonical-source
          python scripts/sync_hacktricks_privesc.py --book-root .canonical-source --check
          python -m pytest -q tests/test_privesc_sync.py tests/test_peaso_privesc_schema_ext_jsonschema.py
      - name: Commit changed privesc catalog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add peaso/privesc/catalog risk_rules/hacktricks-privesc-source.json
          if git diff --cached --quiet; then
            echo 'Canonical privesc hashes are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync privilege-escalation paths from HackTricks Cloud'
          git push origin "HEAD:$DEFAULT_BRANCH"
